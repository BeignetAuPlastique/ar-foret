<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR - Cube Tracking Multi-Faces</title>
  <!-- Import d'A-Frame et MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="batimentModel" src="./mon_batiment.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- FACE 1 - HAUT (Rabattue à +90° sur X par rapport au Nord) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 0" 
        rotation="90 0 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 2 - NORD (Référence fixée : 0 0 0) -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 0" 
        rotation="0 0 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 3 - EST (Pivotement de -90° sur Y) -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 0" 
        rotation="0 -90 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 4 - SUD (Pivotement de 180° sur Y) -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 0" 
        rotation="0 180 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 5 - OUEST (Pivotement de +90° sur Y) -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 0" 
        rotation="0 90 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 6 - BAS (Rabattue à -90° sur X) -->
    <a-entity mindar-image-target="targetIndex: 5">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 0" 
        rotation="-90 0 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
