<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Suivi de Marqueur</title>
  <!-- Import d'A-Frame et MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Scene AR liée au fichier targets.mind -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Chargement du modèle 3D GLB -->
      <a-asset-item id="batimentModel" src="./mon_batiment.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- La cible (index 0 = la 1ère image dans targets.mind) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 
        position: X Y Z (en mètres par rapport au QR Code)
        rotation: X Y Z (en degrés)
        scale: Taille du modèle (ex: 0.1 0.1 0.1 si le modèle est très grand)
      -->
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 0" 
        rotation="90 0 0" 
        scale="1 1 1">
      </a-gltf-model>

    </a-entity>
  </a-scene>

</body>
</html>
