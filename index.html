<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR - Cube Tracking Multi-Faces</title>
  <!-- Import d'A-Frame et MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="batimentModel" src="./mon_batiment.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 
      Pour ajuster la position exacte du bâtiment au centre du cube :
      Remplacez (L/2) par la demi-taille du cube en mètres (ex: Z = -0.045 pour un cube de 9 cm).
    -->

    <!-- FACE 1 - HAUT (Cible horizontale au dessus du cube) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 -0.045" 
        rotation="90 0 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 2 - NORD (Cible verticale face Nord) -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 -0.045" 
        rotation="0 0 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 3 - EST (Cible verticale face Est) -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 -0.045" 
        rotation="0 -90 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 4 - SUD (Cible verticale face Sud) -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 -0.045" 
        rotation="0 180 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 5 - OUEST (Cible verticale face Ouest) -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 -0.045" 
        rotation="0 90 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- FACE 6 - BAS (Cible horizontale sous le cube) -->
    <a-entity mindar-image-target="targetIndex: 5">
      <a-gltf-model 
        src="#batimentModel" 
        position="0 0 -0.045" 
        rotation="-90 0 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
